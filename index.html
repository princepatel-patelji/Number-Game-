<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number | Prince Edition</title>

    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2f">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #1f1c2c, #928DAB, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="name-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-2xl text-center max-w-sm w-full mx-4 fade-in">
            <div class="text-5xl mb-4">👋</div>
            <h2 class="text-2xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">Welcome to Prince Games!</h2>
            <p class="text-gray-300 text-sm mb-6">Enter your name to track your awesome score.</p>
            <input type="text" id="player-name-input" placeholder="Your Name..." 
                class="w-full bg-black/50 border border-white/20 rounded-xl py-3 px-4 text-center text-xl font-bold text-white outline-none focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/50 mb-4 transition-all">
            <button onclick="window.savePlayerName()" class="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-yellow-500 to-orange-500 hover:from-yellow-400 hover:to-orange-400 text-black shadow-lg transition-all transform hover:scale-105">
                Let's Play! 🚀
            </button>
        </div>
    </div>

    <div class="absolute top-6 left-0 w-full flex justify-center fade-in">
        <div class="glass-panel px-6 py-2 rounded-full flex items-center gap-3 border-yellow-500/30">
            <span class="text-2xl">👑</span>
            <span class="font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500 uppercase text-sm">
                Prince Games
            </span>
        </div>
    </div>

    <div class="max-w-md w-full mt-20 z-10">
        <div class="glass-panel rounded-2xl p-4 mb-4 flex justify-between items-center fade-in">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-400 to-purple-600 flex items-center justify-center text-xl shadow-lg border-2 border-white/20">
                    👤
                </div>
                <div>
                    <div class="text-[10px] text-gray-400 uppercase tracking-wider font-bold">Player</div>
                    <div id="display-player-name" class="font-bold text-lg text-white">
                        Guest
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2 text-center">
                <div class="stat-box px-3 py-1.5 rounded-xl border-green-500/30">
                    <div class="text-[9px] text-gray-400 uppercase font-bold">Wins</div>
                    <div id="stat-wins" class="text-xl font-black text-green-400 drop-shadow-md">0</div>
                </div>
                <div class="stat-box px-3 py-1.5 rounded-xl border-red-500/30">
                    <div class="text-[9px] text-gray-400 uppercase font-bold">Losses</div>
                    <div id="stat-losses" class="text-xl font-black text-red-400 drop-shadow-md">0</div>
                </div>
            </div>
        </div>

        <div id="game-container" class="glass-panel rounded-3xl p-8 w-full text-center fade-in relative overflow-hidden">
            
            <!-- Header -->
            <h1 class="text-3xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 drop-shadow-lg">
                Guess The Number
            </h1>
            <p class="text-gray-300 text-sm mb-8 font-medium" id="subtitle">Can you crack the code?</p>

            <!-- Screen 1: Difficulty Selection -->
            <div id="screen-start" class="space-y-3 relative z-10">
                <button onclick="window.startGame(50, 10)" class="w-full py-3.5 rounded-xl font-bold bg-white/5 hover:bg-green-500/40 transition-all border border-green-500/30 hover:scale-[1.02] flex justify-between px-6 items-center group">
                    <span class="text-green-400 group-hover:text-white transition-colors">🟢 Easy (1-50)</span>
                    <span class="text-xs bg-black/40 px-2 py-1 rounded-md text-gray-300">10 Chances</span>
                </button>
                <button onclick="window.startGame(100, 7)" class="w-full py-3.5 rounded-xl font-bold bg-white/5 hover:bg-yellow-500/40 transition-all border border-yellow-500/30 hover:scale-[1.02] flex justify-between px-6 items-center group">
                    <span class="text-yellow-400 group-hover:text-white transition-colors">🟡 Medium (1-100)</span>
                    <span class="text-xs bg-black/40 px-2 py-1 rounded-md text-gray-300">7 Chances</span>
                </button>
                <button onclick="window.startGame(500, 5)" class="w-full py-3.5 rounded-xl font-bold bg-white/5 hover:bg-orange-500/40 transition-all border border-orange-500/30 hover:scale-[1.02] flex justify-between px-6 items-center group">
                    <span class="text-orange-400 group-hover:text-white transition-colors">🟠 Hard (1-500)</span>
                    <span class="text-xs bg-black/40 px-2 py-1 rounded-md text-gray-300">5 Chances</span>
                </button>
                <button onclick="window.startGame(1000, 4)" class="w-full py-3.5 rounded-xl font-bold bg-white/5 hover:bg-red-600/50 transition-all border border-red-500/50 hover:scale-[1.02] flex justify-between px-6 items-center group shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                    <span class="text-red-400 group-hover:text-white transition-colors">🔴 Extreme (1-1000)</span>
                    <span class="text-xs bg-black/40 px-2 py-1 rounded-md text-gray-300">4 Chances</span>
                </button>
            </div>

            <div id="screen-game" class="hidden space-y-6 fade-in relative z-10">
                <div class="flex justify-between items-center text-sm font-bold bg-black/40 p-4 rounded-xl border border-white/10 shadow-inner">
                    <span id="range-text" class="text-cyan-400 flex items-center gap-2"><span class="text-lg">🎯</span> 1 to 100</span>
                    <span id="attempts-text" class="text-yellow-400 flex items-center gap-2"><span class="text-lg">⏳</span> 7 Left</span>
                </div>

                <div class="relative">
                    <input type="number" id="guess-input" placeholder="Tap to enter number..." 
                        class="w-full bg-black/50 border-2 border-white/10 rounded-2xl py-5 px-4 text-center text-3xl font-black text-white outline-none focus:border-cyan-400 focus:shadow-[0_0_20px_rgba(34,211,238,0.3)] transition-all">
                </div>

                <button onclick="window.checkGuess()" id="submit-btn" class="w-full py-4 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all transform hover:-translate-y-1 active:translate-y-1">
                    SUBMIT GUESS
                </button>

                <div id="feedback-msg" class="h-8 font-black text-xl tracking-wide drop-shadow-md"></div>
            </div>

            <div id="screen-result" class="hidden space-y-6 fade-in relative z-10">
                <div id="result-emoji" class="text-6xl animate-bounce"></div>
                <h2 id="result-title" class="text-4xl font-black mb-2 uppercase tracking-wider"></h2>
                <p id="result-desc" class="text-gray-300 text-lg leading-relaxed"></p>
                
                <button onclick="window.resetGame()" class="w-full py-4 rounded-2xl font-black text-lg bg-white text-black hover:bg-gray-200 transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)] mt-6 hover:scale-105 active:scale-95">
                    PLAY AGAIN 🔄
                </button>
            </div>

        </div>
    </div>

    <div class="absolute bottom-4 left-0 w-full text-center">
        <p class="text-xs text-white/40 font-semibold tracking-widest uppercase">
            Game Developer: <span class="text-yellow-500/70">Prince</span>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Game Variables
        let targetNumber, maxAttempts, attemptsLeft, attemptsUsed, maxRange;
        let playerStats = { wins: 0, losses: 0, playerName: "" };
        let db, auth, userId, appId, cloudActive = false;

        // UI Elements
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');
        const guessInput = document.getElementById('guess-input');
        const feedbackMsg = document.getElementById('feedback-msg');
        const container = document.getElementById('game-container');
        const statWinsEl = document.getElementById('stat-wins');
        const statLossesEl = document.getElementById('stat-losses');
        const displayNameEl = document.getElementById('display-player-name');
        const nameModal = document.getElementById('name-modal');
        const nameInput = document.getElementById('player-name-input');

        let synth, polySynth, isAudioInit = false;

        async function initAudio() {
            if (isAudioInit) return;
            await Tone.start();
            synth = new Tone.Synth().toDestination();
            polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
            isAudioInit = true;
        }

        function playSound(type) {
            if (!isAudioInit) return;
            const now = Tone.now();
            if (type === 'click') {
                synth.triggerAttackRelease("C5", "32n");
            } else if (type === 'wrong') {
                synth.triggerAttackRelease("G2", "8n");
            } else if (type === 'win') {
                polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n");
                setTimeout(() => polySynth.triggerAttackRelease(["E4", "G4", "C5", "E5"], "2n"), 0.3);
            } else if (type === 'lose') {
                synth.triggerAttackRelease("D3", "4n");
                synth.triggerAttackRelease("C3", "4n", now + 0.3);
                synth.triggerAttackRelease("G2", "2n", now + 0.6);
            }
        }

        async function initCloud() {
            try {
                if (typeof __app_id === 'undefined' || typeof __firebase_config === 'undefined') {
                    console.log("Local mode. Checking local variables.");
                    checkPlayerName();
                    return; 
                }

                appId = __app_id;
                const app = initializeApp(JSON.parse(__firebase_config));
                auth = getAuth(app);
                db = getFirestore(app);
                
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser.uid;
                cloudActive = true;
                await loadStats();
            } catch (error) {
                console.error("Cloud failed, local mode active.", error);
                checkPlayerName();
            }
        }

        async function loadStats() {
            if (!cloudActive || !userId) return checkPlayerName();
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'player_stats');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    playerStats = { ...playerStats, ...docSnap.data() };
                }
            } catch (e) {
                console.error("Error loading stats", e);
            }
            checkPlayerName();
            updateStatsUI();
        }

        async function saveStats() {
            updateStatsUI();
            if (!cloudActive || !userId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'player_stats');
                await setDoc(docRef, playerStats);
            } catch (e) {}
        }

        function updateStatsUI() {
            statWinsEl.innerText = playerStats.wins;
            statLossesEl.innerText = playerStats.losses;
            if(playerStats.playerName) {
                displayNameEl.innerText = playerStats.playerName;
            }
            
            // Animation triggers
            statWinsEl.classList.remove('pop');
            statLossesEl.classList.remove('pop');
            void statWinsEl.offsetWidth; 
            statWinsEl.classList.add('pop');
            statLossesEl.classList.add('pop');
        }

        function checkPlayerName() {
            if (!playerStats.playerName || playerStats.playerName.trim() === "") {
                nameModal.classList.remove('hidden');
                setTimeout(() => nameInput.focus(), 100);
            } else {
                updateStatsUI();
            }
        }

        window.savePlayerName = async function() {
            const name = nameInput.value.trim();
            if(name) {
                await initAudio(); // Start audio context on user gesture
                playerStats.playerName = name;
                playSound('click');
                nameModal.classList.add('hidden');
                saveStats();
            } else {
                nameInput.classList.add('border-red-500');
            }
        }

        nameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.savePlayerName();
        });

        window.startGame = async function(range, attempts) {
            await initAudio();
            playSound('click');
            
            maxRange = range;
            maxAttempts = attempts;
            attemptsLeft = attempts;
            attemptsUsed = 0;
            
            targetNumber = Math.floor(Math.random() * maxRange) + 1;

            document.getElementById('range-text').innerHTML = `<span class="text-lg">🎯</span> 1 to ${maxRange}`;
            document.getElementById('attempts-text').innerHTML = `<span class="text-lg">⏳</span> ${attemptsLeft} Left`;
            feedbackMsg.innerText = "";
            guessInput.value = "";

            screenStart.classList.add('hidden');
            screenResult.classList.add('hidden');
            screenGame.classList.remove('hidden');
            
            setTimeout(() => guessInput.focus(), 100);
        }

        guessInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                window.checkGuess();
            }
        });

        window.checkGuess = function() {
            const guessVal = guessInput.value;
            
            if (!guessVal || isNaN(guessVal) || guessVal < 1) {
                showFeedback("Invalid Number!", "text-red-400");
                playSound('wrong');
                triggerShake();
                return;
            }

            const guess = parseInt(guessVal);
            attemptsLeft--;
            attemptsUsed++;

            if (guess === targetNumber) {
                endGame(true);
            } else if (attemptsLeft === 0) {
                endGame(false);
            } else {
                playSound('wrong');
                if (guess < targetNumber) {
                    showFeedback("TOO LOW! 📈 Go higher.", "text-yellow-400");
                } else {
                    showFeedback("TOO HIGH! 📉 Go lower.", "text-orange-400");
                }
                triggerShake();
                guessInput.value = "";
                guessInput.focus();
            }
            
            document.getElementById('attempts-text').innerHTML = `<span class="text-lg">⏳</span> ${attemptsLeft} Left`;
        }

        function showFeedback(message, colorClass) {
            feedbackMsg.className = `h-8 font-black text-xl tracking-wide drop-shadow-md ${colorClass} fade-in`;
            feedbackMsg.innerText = message;
        }

        function triggerShake() {
            container.classList.remove('shake');
            void container.offsetWidth;
            container.classList.add('shake');
        }

        function fireConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function endGame(isWin) {
            screenGame.classList.add('hidden');
            screenResult.classList.remove('hidden');

            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const emoji = document.getElementById('result-emoji');

            if (isWin) {
                playSound('win');
                playerStats.wins++; 
                emoji.innerText = "🏆";
                title.innerText = "EPIC WIN!";
                title.className = "text-5xl font-black mb-2 text-green-400 drop-shadow-[0_0_15px_rgba(74,222,128,0.8)]";
                desc.innerHTML = `Amazing <b>${playerStats.playerName}</b>!<br>You cracked the code <b>${targetNumber}</b> in <span class="text-yellow-400 font-bold">${attemptsUsed}</span> attempts!`;
                
                fireConfetti();
            } else {
                playSound('lose');
                playerStats.losses++; 
                emoji.innerText = "💥";
                title.innerText = "GAME OVER   (Khel Khtm Beta)";
                title.className = "text-5xl font-black mb-2 text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]";
                desc.innerHTML = `You ran out of attempts.<br>The correct number was <span class="text-cyan-400 font-black text-2xl ml-2">${targetNumber}</span>`;
            }
            
            saveStats();
        }

        window.resetGame = function() {
            playSound('click');
            screenResult.classList.add('hidden');
            screenStart.classList.remove('hidden');
        }

        // Initialize App
        initCloud();
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(registration => console.log('Service Worker Registered!'))
        .catch(err => console.log('Service Worker failed: ', err));
    });
  }
</script>
</body>
</html>
